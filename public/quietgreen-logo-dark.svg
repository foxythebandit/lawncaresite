<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@300;400&amp;display=swap');
      .wordmark { font-family: 'DM Serif Display', Georgia, serif; }
      .tagline { font-family: 'DM Sans', sans-serif; font-weight: 300; letter-spacing: 0.12em; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="520" height="120" rx="10" fill="#1a3a2a"/>

  <!-- Leaf icon — bright on dark -->
  <g transform="translate(12, 8)">
    <path d="M40 0 C55 12 72 28 72 48 C72 68 58 82 40 88 C22 82 8 68 8 48 C8 28 25 12 40 0 Z" fill="#52b788"/>
    <line x1="40" y1="8" x2="40" y2="82" stroke="#2d6a4f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M40 88 C40 94 38 100 35 104" stroke="#52b788" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M46 24 L34 50 L43 50 L34 70 L52 42 L43 42 Z" fill="#1a3a2a"/>
    <circle cx="63" cy="22" r="8" fill="#b7e4c7"/>
    <circle cx="63" cy="22" r="4" fill="#52b788"/>
  </g>

  <!-- Wordmark — pure white for maximum contrast on dark bg -->
  <text x="116" y="72" class="wordmark" font-size="52" fill="#ffffff">QuietGreen</text>
  <text x="118" y="94" class="tagline" font-size="11" fill="#52b788">ELECTRIC LAWN CARE  ·  AUSTIN, TX</text>
</svg>
